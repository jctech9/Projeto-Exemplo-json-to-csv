spring.application.name=demo

# HTTP integration settings for API export
export.api.page-size=5000
export.api.http.connect-timeout=5s
export.api.http.read-timeout=30s
export.api.http.retry.max-attempts=3
export.api.http.retry.initial-interval=400ms
export.api.http.retry.max-interval=3s
export.api.http.retry.multiplier=2.0
